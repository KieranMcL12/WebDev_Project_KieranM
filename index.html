<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Home - Wheels of Fire</title>
	<link rel="stylesheet" href="/styles/main.css">
	<link rel="stylesheet" href="/Fonts/fonts.css">
	<style>
		main .cotwImg {
			width: 900px;
			height: 600px;
			border-radius: 40px;
			overflow: hidden;
			justify-content: center;
			align-items: center;
			display: flex;
		}

		main .cotwImg::before {
			content: '';
			background: url('./images/COTWLogo.svg') no-repeat center center/cover;
			position: absolute;
			z-index: 1;
			width: calc(900px/2);
			height: calc(600px/2);
			filter: blur(0) opacity(1);
			transition: all 0.3s ease;
		}

		main .cotwImg::after {
			content: '☝ Hover over the logo to reveal this week\'s Car of the Week ☝';
			position: absolute;
			z-index: 1;
			transform: translateY(30vh);
			font-style: italic;
			font-size: small;
			color: whitesmoke;
			animation: 1.5s ease 0s infinite alternate bounce;
			filter: blur(0) opacity(1);
			transition: all 0.3s ease;
		}

		main .cotwImg:hover {
			cursor: pointer;
		}

		main .cotwImg:hover::before,
		main .cotwImg:hover::after {
			filter: blur(10px) opacity(0);
		}

		main .cotwImg img {
			width: 900px;
			height: 600px;
			justify-content: center;
			align-items: center;
			filter: blur(10px) brightness(0.8);
			transition: all 0.5s ease;
		}

		main .cotwImg img+b::before {
			content: 'This week\'s Car of the Week: The 1969 Chevolet Camaro SS';
			position: absolute;
			left: 20px;
			top: 90vh;
			z-index: -100;
			font-style: italic;
			font-size: small;
			font-weight: 500;
			color: gray;
			text-decoration: underline;
			filter: blur(10px) opacity(0);
			transition: top 0.3s ease, filter 0.3s ease;
			transition-delay: 0s, 0.2s;
		}

		main .cotwImg:hover img {
			filter: blur(0);
		}

		main .cotwImg:hover img+b::before {
			filter: blur(0) opacity(1);
			top: 105vh;
			transition-delay: 0.5s, 0.55s;
		}

		@keyframes bounce {
			0% {
				transform: translateY(29vh);
			}
		}
	</style>
</head>

<body>
	<header>
		<nav>
			<ul>
				<li class="siteLogo"><a href="index.html"><img src="./images/spinningWheel.svg" alt="Home"
							height="30px"></a></li>
				<li class="active"><a href="index.html">Home</a></li>
				<li><a href="about.html">About</a></li>
				<li><a href="contact.html">Contact</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<h1>Car of the Week</h1>
		<div id="cotwImg" class="cotwImg">
			<img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/1969_Chevolet_Camaro_SS%2C_Tallahassee_Automobile_Museum.jpg/960px-1969_Chevolet_Camaro_SS%2C_Tallahassee_Automobile_Museum.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail"
				alt="1969 Chevolet Camaro SS, Tallahassee Automobile Museum, Tallahassee, Leon County, Florida">
			<b></b>
		</div>

		<div id="cotwModal" class="modal">
			<!-- Modal content -->
			<div class="modal-content">
				<div class="modal-header">
					<span class="close">&times;</span>
					<p>Car of the Week</p>
				</div>
				<div class="modal-body">
					<p>This week's Car of the Week: The 1969 Chevolet Camaro SS</p>
				</div>
				<div class="modal-footer">
					<h3><a href="https://en.wikipedia.org/wiki/Chevrolet_Camaro_(first_generation)">Learn More</a></h3>
				</div>
			</div>
		</div>
	</main>

	<footer>
		<p>Copyright &copy; 2026 <i>Wheels of Fire</i>, John O'Reilly</p>
	</footer>

	<script>
		// Get the modal
		var modal = document.getElementById("cotwModal");

		// Get the button that opens the modal
		var btn = document.getElementById("cotwImg");

		// Get the <span> element that closes the modal
		var span = document.getElementsByClassName("close")[0];

		// When the user clicks on the button, open the modal
		btn.onclick = function () {
			modal.style.display = "block";
		}

		// When the user clicks on <span> (x), close the modal
		span.onclick = function () {
			modal.style.display = "none";
		}

		// When the user clicks anywhere outside of the modal, close it
		window.onclick = function (event) {
			if (event.target == modal) {
				modal.style.display = "none";
			}
		}
	</script>
</body>

</html>
