<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Home - Wheels of Fire</title>
	<style>
		html,
		body {
			margin: 0;
			padding: 0;
		}

		ul {
			list-style-type: none;
			margin: 0;
			padding: 0;
			overflow: hidden;
			background-color: #333333;
		}

		li {
			float: left;
		}

		li a {
			display: block;
			color: white;
			text-align: center;
			padding: 16px;
			text-decoration: none;
		}

		li:not(:first-child) a:hover {
			background-color: #111111;
		}

		li.active {
			text-decoration: underline;
			text-decoration-color: white;
		}

		main {
			padding: 20px;
		}

		main h1 {
			margin: 0;
		}

		main .cotwImg {
			width: 900px;
			height: 600px;
			border-radius: 40px;
			overflow: hidden;
			justify-content: center;
            align-items: center;
			display: flex;
		}

		main .cotwImg::before {
			content: '';
			background: url('images/COTWLogo.svg') no-repeat center center/cover;
			position: absolute;
			z-index: 1;
			width: calc(900px/2);
			height: calc(600px/2);
			filter: blur(0) opacity(1);
			transition: all 0.3s ease;
		}

		main .cotwImg:hover {
			cursor: pointer;
		}

		main .cotwImg:hover::before {
			filter: blur(10px) opacity(0);
		}

		main .cotwImg img {
			filter: blur(10px) brightness(0.8);
			transition: all 0.5s ease;
		}

		main .cotwImg:hover img {
			filter: blur(0);
		}

		footer {
			position: relative;
			left: 0;
			bottom: 0;
			width: 100%;
			text-align: center;
		}
	</style>
</head>

<body>
	<header>
		<nav>
			<ul>
				<li><a href="#">Wheels of Fire</a></li>
				<li class="active"><a href="index.html">Home</a></li>
				<li><a href="about.html">About</a></li>
				<li><a href="contact.html">Contact</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<h1>Car of the Week</h1>
		<div class="cotwImg">
			<img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/1969_Chevolet_Camaro_SS%2C_Tallahassee_Automobile_Museum.jpg/960px-1969_Chevolet_Camaro_SS%2C_Tallahassee_Automobile_Museum.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail"
				alt="1969 Chevolet Camaro SS, Tallahassee Automobile Museum, Tallahassee, Leon County, Florida">
		</div>
	</main>

	<footer>
		<p>Copyright &copy; 2026 <i>Wheels of Fire</i>, John O'Reilly</p>
	</footer>
</body>

</html>
